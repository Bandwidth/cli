# TEMPORARY: validates that the Vault-issued GitHub PAT can reach the Homebrew
# tap before relying on it in the real release pipeline. Delete this file once
# a release has bumped the formula successfully via vault-provider-action.
name: Validate tap token (temp)

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get Homebrew tap token from Vault
        uses: Bandwidth/vault-provider-action@v1
        with:
          export-github-pat: true
          identity-source: repo
          durable-team-name: BAND SWI

      - name: Verify token can write to the tap
        env:
          GH_TOKEN: ${{ env.GITHUB_TEAM_ACCESS_TOKEN }}
        run: |
          echo "Permissions the Vault token holds on Bandwidth/homebrew-tap:"
          perms=$(gh api repos/Bandwidth/homebrew-tap --jq '.permissions')
          echo "$perms"
          if echo "$perms" | grep -q '"push":true'; then
            echo "OK: token has write access to the tap."
          else
            echo "FAIL: token lacks write access to the tap."
            exit 1
          fi
